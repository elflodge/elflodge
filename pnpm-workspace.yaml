packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAge: 1440
allowBuilds:
  # Both download their platform's native binary in postinstall; wrangler needs them.
  workerd: true
  esbuild: true
  # Testcontainers' Docker client pulls these in; their install scripts are optional
  # native speed-ups or version checks it does not need.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # The Runner's dependencies. pi-ai's Google SDK has a no-op install script.
  "@google/genai": false
# sandbox-runtime's Windows backend, about 170 MB with the native modules it brings: the Runner does
# not run on native Windows, so neither installing nor building it serves anything. Drop this once
# a sandbox-runtime release includes anthropics/sandbox-runtime#822, which makes it an optional peer.
ignoredOptionalDependencies:
  - "@microsoft/mxc-sdk"
catalog:
  "@anthropic-ai/sandbox-runtime": ^0.0.82
  "@better-auth/api-key": 1.7.18
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@earendil-works/chord": ^1.5.2
  "@earendil-works/pi-ai": ^1.5.2
  "@earendil-works/pi-durable": ^1.5.2
  "@earendil-works/pi-env": ^1.5.2
  "@earendil-works/pi-schema": ^1.5.2
  "@effect/platform-node-shared": ^4.1.2
  "@effect/vitest": 4.1.2
  "@hono/node-server": ^2.1.6
  "@orpc/client": 2.0.0-beta.49
  "@orpc/contract": 2.0.0-beta.49
  "@orpc/effect": 2.0.0-beta.49
  "@orpc/json-schema": 2.0.0-beta.49
  "@orpc/openapi": 2.0.0-beta.49
  "@orpc/server": 2.0.0-beta.49
  "@orpc/shared": 2.0.0-beta.49
  "@orpc/zod": 2.0.0-beta.49
  "@standard-schema/utils": ^0.3.0
  "@testcontainers/postgresql": ^12.2.1
  "@types/folder-hash": ^4.0.4
  "@types/node": ^22.20.5
  "@types/pg": ^8.23.1
  "@types/ms": ^2.1.0
  "@types/proper-lockfile": ^4.1.4
  "@types/ws": ^8.18.2
  atomically: ^2.1.1
  auth: 1.7.18
  birpc: ^4.2.0
  better-auth: 1.7.18
  canonicalize: ^5.1.0
  chunk-data: ^0.1.0
  cidr-tools: ^13.0.4
  content-type: ^3.1.1
  crossws: ^0.4.17
  effect: ^4.1.2
  ensure-error: ^5.0.0
  env-paths: ^4.0.0
  folder-hash: ^4.1.4
  generate-license-file: ^4.2.5
  get-port: ^7.2.0
  hono: 5.0.0-rc.1
  hono-problem-details: ^0.12.3
  is-network-error: ^1.3.2
  is-path-inside: ^4.0.0
  json-rpc-2.0: ^1.8.1
  json-schema-library: ^11.6.16
  kanel: ^4.0.4
  kanel-kysely: ^4.0.0
  kysely: ^0.29.8
  log-update: ^8.0.0
  ms: ^2.1.3
  nf3: ^0.4.2
  pg: ^8.23.1
  proper-lockfile: ^4.1.2
  rolldown: ^1.3.0
  rollup-plugin-license: ^3.7.1
  sync-message-port: ^1.2.0
  testcontainers: ^12.2.1
  trpc-cli: ^0.17.1
  type-fest: ^5.10.0
  # Exactly the version Pi pins, so installs share Pi's copy; a range would resolve to a newer one
  # beside it. Follow Pi when it moves.
  typebox: 1.4.5
  # TypeScript 7.0 only: the declaration build that vite-plus bundles (rolldown-plugin-dts 0.28)
  # recognises 7.0 and fails on 7.1; its 0.29 needs 7.1 (voidzero-dev/vite-plus#3237). Move to 7.1
  # when vite-plus bundles it.
  typescript: ~7.0.2
  uuid: ^14.0.3
  valid-filename: ^5.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  vitest: 5.1.0
  wrangler: ^4.158.0
  # The version Pi's chord takes as a peer, exactly: with any other, pi-ai resolves twice, and
  # `pnpm deploy` cannot build the Runner's image, whose extension adapter takes pi-ai as a peer.
  ws: 8.21.0
  zod: ^4.6.7
catalogs:
  # pi-durable-extension-adapter relies on the coding agent's internal files (its loader, its
  # extension view of pi-ai, the modules whose import registers providers, its path helpers), which
  # any release may move or change, so it takes only the version its tests ran on.
  pi-durable-extension-adapter:
    "@earendil-works/pi-coding-agent": 1.5.2

patchedDependencies:
  # Upstream changes not yet released, applied to the published dist; drop each part once a release
  # contains its change: anthropics/sandbox-runtime#594 (no `which` spawn for the shell; the patch
  # only skips it for an absolute path, see JOB_SHELL in apps/runner/src/sandbox.ts), #807 (IP
  # literals and CIDR ranges in allowedDomains and deniedDomains), #769 (NO_PROXY lists loopback
  # only, so private addresses reach the proxy) and #597 (a refusal's reason in the body of a
  # plain-HTTP 403, and network.allowlistDenyReason).
  "@anthropic-ai/sandbox-runtime@0.0.82": patches/@anthropic-ai__sandbox-runtime@0.0.82.patch
  "@types/folder-hash@4.0.4": patches/@types__folder-hash@4.0.4.patch
  generate-license-file: patches/generate-license-file.patch
