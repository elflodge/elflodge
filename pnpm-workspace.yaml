packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

overrides:
  # Better Auth and the dashboard must share one BetterFetchError constructor.
  "@better-fetch/fetch@*": "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
minimumReleaseAge: 1440
allowBuilds:
  # Both download their platform's native binary in postinstall; wrangler needs them.
  workerd: true
  esbuild: true
  # Testcontainers' Docker client pulls these in; their install scripts are optional
  # native speed-ups or version checks it does not need.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # The Runner's dependencies. pi-ai's Google SDK has a no-op install script.
  "@google/genai": false
catalog:
  "@anthropic-ai/sandbox-runtime": ^0.0.83
  "@better-auth/api-key": 1.7.26
  "@better-fetch/fetch": 1.3.3
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@earendil-works/chord": ^1.6.0
  "@earendil-works/pi-ai": ^1.6.0
  "@earendil-works/pi-durable": ^1.6.0
  "@earendil-works/pi-env": ^1.6.0
  "@earendil-works/pi-schema": ^1.6.0
  "@effect/platform-node-shared": ^4.1.4
  "@effect/vitest": 4.1.4
  "@fontsource-variable/instrument-sans": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@hono/node-server": ^2.1.9
  "@noble/hashes": ^2.4.0
  "@orpc/client": 2.0.0-beta.51
  "@orpc/contract": 2.0.0-beta.51
  "@orpc/effect": 2.0.0-beta.51
  "@orpc/json-schema": 2.0.0-beta.51
  "@orpc/openapi": 2.0.0-beta.51
  "@orpc/server": 2.0.0-beta.51
  "@orpc/shared": 2.0.0-beta.51
  "@orpc/tanstack-query": 2.0.0-beta.51
  "@orpc/zod": 2.0.0-beta.51
  "@solidjs/vite-plugin": ^3.0.1
  "@solidjs/web": ^2.0.1
  "@standard-schema/utils": ^0.3.0
  "@standard-server/core": ~0.16.0
  "@tanstack/solid-query": 6.0.0-rc.6
  "@tanstack/solid-router": 2.0.0-rc.11
  "@tanstack/solid-start": 2.0.0-rc.10
  "@testcontainers/postgresql": ^12.2.1
  "@types/folder-hash": ^4.0.4
  "@types/node": ^22.20.5
  "@types/pg": ^8.23.1
  "@types/ms": ^2.1.0
  "@types/proper-lockfile": ^4.1.4
  "@types/statuses": ^2.0.6
  "@types/ws": ^8.18.2
  "@ui-sdk/core": 0.1.0-beta.14
  "@ui-sdk/solid": 0.1.0-beta.14
  atomically: ^2.1.1
  auth: 1.7.26
  birpc: ^4.2.0
  better-auth: 1.7.26
  canonicalize: ^5.1.0
  chunk-data: ^0.1.0
  cidr-tools: ^13.0.4
  content-type: ^3.1.1
  crossws: ^0.4.17
  effect: ^4.1.4
  ensure-error: ^5.0.0
  env-paths: ^4.0.0
  folder-hash: ^4.1.4
  generate-license-file: ^4.2.5
  get-port: ^7.2.0
  hono: 5.0.0-rc.1
  hono-problem-details: ^0.12.3
  is-network-error: ^1.3.2
  is-path-inside: ^4.0.0
  json-rpc-2.0: ^1.8.1
  json-schema-library: ^11.6.16
  kanel: ^4.0.6
  kanel-kysely: ^4.0.1
  kysely: ^0.29.9
  log-update: ^8.0.0
  ms: ^2.1.3
  nf3: ^0.4.3
  pg: ^8.23.1
  playwright: ^1.65.1
  proper-lockfile: ^4.1.2
  rolldown: ^1.3.3
  rollup-plugin-license: ^3.7.2
  solid-js: ^2.0.1
  statuses: ^2.0.2
  sync-message-port: ^1.2.0
  testcontainers: ^12.2.1
  tiny-merge-patch: ^1.0.0
  trpc-cli: ^0.17.1
  # Exactly the version Pi pins, so installs share Pi's copy; a range would resolve to a newer one
  # beside it. Follow Pi when it moves: Dependabot leaves it alone, and the adapter's tests fail
  # while the two differ.
  typebox: 1.3.27
  # TypeScript 7.0 only: the declaration build that vite-plus bundles (rolldown-plugin-dts 0.28)
  # recognises 7.0 and fails on 7.1; its 0.29 needs 7.1 (voidzero-dev/vite-plus#3237). Move to 7.1
  # when vite-plus bundles it.
  typescript: ~7.0.2
  ufo: 1.6.4
  uuid: ^14.0.3
  valid-filename: ^5.0.0
  # Vite+ pins both this core alias and Vitest in its published dependencies.
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vitest: 5.1.0
  wrangler: ^4.165.0
  # A different ws version resolves pi-ai twice through its optional peers and makes pnpm deploy
  # reject the Runner graph. Verify a production deploy before moving the pin.
  ws: 8.21.0
  zod: ^4.6.7
catalogs:
  # pi-durable-extension-adapter relies on the coding agent's internal files (its loader, its
  # extension view of pi-ai, the modules whose import registers providers, its path helpers), which
  # any release may move or change, so it takes only the version its tests ran on.
  pi-durable-extension-adapter:
    "@earendil-works/pi-coding-agent": 1.6.0

patchedDependencies:
  # Upstream changes not yet released, applied to the published dist; drop each part once a release
  # contains its change: anthropics/sandbox-runtime#594 (no `which` spawn for the shell; the patch
  # only skips it for an absolute path, see JOB_SHELL in apps/runner/src/sandbox.ts) and the part of
  # #597 that puts a refusal's reason in the body of a plain-HTTP 403.
  "@anthropic-ai/sandbox-runtime@0.0.83": patches/@anthropic-ai__sandbox-runtime@0.0.83.patch
  "@types/folder-hash@4.0.4": patches/@types__folder-hash@4.0.4.patch
  generate-license-file: patches/generate-license-file.patch
