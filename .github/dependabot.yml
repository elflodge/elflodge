version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Types must match the Node versions we support (engines), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Move ws with the Pi graph: separate peer versions break the Runner production deploy.
      # This also suppresses security-update PRs for ws. Review its advisories manually and
      # verify the Runner's production deploy when updating the pin.
      - dependency-name: "ws"
      # The exact version Pi pins, which installs then share (pnpm-workspace.yaml); it moves with Pi.
      - dependency-name: "typebox"
      # vite-plus pins Vitest and its @vitest/* packages exactly, and the workspace overrides Vitest to
      # that version so the project and `vp test` share one copy. They move with vite-plus; Dependabot
      # would bump them past its pin. This also suppresses their security-update PRs: a Vitest fix
      # arrives in a vite-plus release, so review Vitest advisories against vite-plus's releases.
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
    # A dependency joins the first group it matches, so the families come before the catch-all.
    groups:
      better-auth:
        patterns:
          - "auth"
          - "better-auth"
          - "@better-auth/*"
      better-auth-security:
        applies-to: security-updates
        patterns:
          - "auth"
          - "better-auth"
          - "@better-auth/*"
      # oRPC's packages are released together, and mixed versions do not type-check.
      orpc:
        patterns:
          - "@orpc/*"
      # Pi's packages pin each other's exact versions, so one bumped alone installs a second copy.
      pi:
        patterns:
          - "@earendil-works/*"
      # Effect's packages are released together and ask for each other's exact versions.
      effect:
        patterns:
          - "effect"
          - "@effect/*"
      # Kept apart from the catch-all because its PR needs work on its branch: Dependabot moves vite-plus
      # but not the `vite` core alias or the Vitest pin. Set both from the new version's published
      # dependencies (`npm view vite-plus@<version> dependencies`); vite-plus refuses to run until the
      # alias matches. `vp migrate` would also add release-age exceptions, which the workspace's
      # cooldown rules out, and pack settings it does not use.
      vite-plus:
        patterns:
          - "vite-plus"
          - "vite"
          - "@voidzero-dev/*"
      # Every other minor or patch update in one pull request, as each rewrites the lockfile and
      # leaves the others to rebase. Majors still come one per pull request.
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
  # The extensions the Runner's image ships, an npm project of their own (ADR 0039).
  - package-ecosystem: "npm"
    directory: "/apps/runner/extensions"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  # Base images in the Dockerfile, pinned by tag and digest.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
