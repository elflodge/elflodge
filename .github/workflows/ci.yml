name: CI

on:
  # GitHub requires these check names before queue entry. PR events record skipped jobs;
  # the jobs allocate runners and perform checks only when the PR enters the merge queue.
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    if: github.event_name == 'merge_group'
    # Ubuntu 24.04 rather than ubuntu-latest: from 25.04, Ubuntu denies sandbox-runtime's seccomp
    # helper the capability it needs, so no job could run (anthropics/sandbox-runtime#429).
    runs-on: &ubuntu ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      # The queue squashes each PR, so a merge group's last commit is its own PR's.
      - run: vp exec commitlint --last --verbose
      # What the Runner's job sandbox needs on Ubuntu (ADR 0027), so tests that run jobs run them as the
      # Runner does. GitHub's image already keeps the runner user's systemd manager running (linger),
      # which the per-job memory limit uses.
      - &job-sandbox
        name: Job sandbox
        run: |
          # kernel.org's Ubuntu mirror as a last fallback: the image's own mirrors all sit behind
          # Canonical's DNS, which an outage takes down at once (actions/runner-images#15296).
          sudo sed -i '$a http://mirrors.edge.kernel.org/ubuntu/' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          # Ubuntu 24.04 strips the capabilities from the user namespaces the sandbox creates (ADR 0027).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # `vp run ready`, with the hub's tests on the Node hub only: `node-22` runs them on the Workers
      # hub, with its Runners on Node 22, so each hub runs the suite once.
      - run: vp check
      # Every package's tests but the hub's, so a new package is tested without being listed here.
      - run: vp run --filter '!hub' test
      - run: vp test --project node
        working-directory: apps/hub
      - run: vp run -r build
      # The migrations must create everything Better Auth needs.
      - run: vp run --no-cache hub#db:draft-auth-migration --check
      # The committed database types must be what the migrations produce.
      - run: vp run --no-cache hub#db:types
      # The build also records the CLI's bundled dependencies in its package.json.
      - name: Fail if generated files differ
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::Generated files are out of date. Run \`vp run -r build\` and \`vp run hub#db:types\`, and commit the result."
            exit 1
          fi

  # What users run on their own Node (the CLI, the Runner, their shared contract and the extension
  # adapter) supports Node 22 from the lowest release `engines.node` allows (ADR 0024); the hub runs
  # only on Node 26 and workerd.
  node-22:
    if: github.event_name == 'merge_group'
    runs-on: *ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          node-version: 22.19.0
      - *job-sandbox
      - run: vp run --filter '!hub' test
      # The hub in workerd, with the tests and the Runners they start on Node 22. The `node` project
      # would run the hub itself on the tests' Node.
      - run: vp test --project workers
        working-directory: apps/hub

  hub-image:
    if: github.event_name == 'merge_group'
    runs-on: *ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # What the Runner's image needs of an Ubuntu 24.04 host, as BuildKit's rootless image
      # does: AppArmor otherwise denies its jobs' sandboxes the user namespaces they need.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Builds the hub's and the Runner's Docker images, starts the hub on a fresh database (ADR 0014)
      # and the Runner beside it; the default test run skips these tagged tests (ADR 0003).
      - run: vp test --project node --tags-filter=container
        working-directory: apps/hub
